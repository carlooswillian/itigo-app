<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo - Detalhes da Viagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSR3uf1opKMwGW5Ywh147tSlU5-q6YDv1WUTCoQCqTitR8Q9u7i9WD61Dp7RkEuWU/exec";
  </script>

  <header class="sticky top-0 z-40 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <button onclick="voltar()" class="bg-white p-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 transition">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <h1 class="font-bold text-xl tracking-tight text-slate-900">Iti<span class="text-indigo-600">Go</span> <span class="text-slate-400 text-sm font-normal">| Detalhes</span></h1>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Cabeçalho da Viagem -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <h2 id="nomeViagem" class="font-bold text-xl text-slate-800">Carregando...</h2>
      <p id="infoDatas" class="text-sm text-slate-500 flex items-center gap-1 mt-1">
        <i data-lucide="calendar" class="w-4 h-4"></i> <span id="txtDatas">--/-- até --/--</span>
      </p>
      
      <!-- Progresso -->
      <div class="mt-4">
        <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
          <span>Progresso do Roteiro</span>
          <span id="txtProgresso">0%</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5">
          <div id="barraProgresso" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Grid de KPIs Financeiros -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Custo Total (Orçado)</span>
        <span id="kpiOrcado" class="text-lg font-extrabold text-slate-800">R$ 0,00</span>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Já Pago</span>
        <span id="kpiPago" class="text-lg font-extrabold text-blue-600">R$ 0,00</span>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 col-span-2 flex items-center justify-between">
        <div>
          <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Atividade Mais Cara</span>
          <span id="kpiMaiorGastoNome" class="text-sm font-bold text-slate-700 truncate block max-w-[200px]">Nenhuma</span>
        </div>
        <span id="kpiMaiorGastoValor" class="text-lg font-extrabold text-rose-500">R$ 0,00</span>
      </div>
    </div>

    <!-- Gastos por Categoria -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h3 class="font-bold text-slate-800 flex items-center gap-2 text-sm uppercase tracking-wide">
        <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i> Gastos por Categoria
      </h3>
      <p class="text-[10px] text-slate-400 leading-tight">Agrupamento direto pelas categorias definidas nos waypoints.</p>
      <div id="listaCategorias" class="space-y-3 pt-2">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- Diárias por Cidade -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h3 class="font-bold text-slate-800 flex items-center gap-2 text-sm uppercase tracking-wide">
        <i data-lucide="map-pin" class="w-4 h-4 text-rose-500"></i> Tempo por Cidade
      </h3>
      <div id="listaCidades" class="grid grid-cols-2 gap-2 pt-2">
        <!-- Renderizado via JS -->
      </div>
    </div>

  </main>

  <div id="modalLoading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl flex flex-col items-center space-y-3">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="font-bold text-slate-800 text-base">Analisando dados...</p>
    </div>
  </div>

  <script>
    window.onload = () => {
      lucide.createIcons();
      carregarDados();
    };

    function voltar() {
      window.history.back();
    }

    async function carregarDados() {
      const urlParams = new URLSearchParams(window.location.search);
      const viagemIdUrl = urlParams.get('viagem');

      if (!viagemIdUrl) {
        alert("Nenhuma viagem especificada.");
        voltar();
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getDados', viagemId: viagemIdUrl })
        });
        const data = await res.json();

        if (data.sucesso) {
          const viagemInfo = data.viagens.find(v => String(v.id) === String(viagemIdUrl));
          const waypoints = data.waypoints.filter(w => String(w.idViagem) === String(viagemIdUrl));

          if (viagemInfo) document.getElementById('nomeViagem').textContent = viagemInfo.nome;
          
          processarDashboard(waypoints);
        }
      } catch (e) {
        alert("Erro ao carregar detalhes.");
      } finally {
        document.getElementById('modalLoading').classList.add('hidden');
      }
    }

    function processarDashboard(waypoints) {
      if (waypoints.length === 0) {
        document.getElementById('txtDatas').textContent = "Nenhum ponto cadastrado.";
        return;
      }

      // 1. Processar Datas e Progresso
      const agora = new Date().getTime();
      let concluidos = 0;
      let datasValidas = [];

      waypoints.forEach(w => {
        if (w.dataHora) {
          const tempo = new Date(w.dataHora).getTime();
          if (!isNaN(tempo)) {
            datasValidas.push(tempo);
            if (tempo < agora) concluidos++;
          }
        }
      });

      if (datasValidas.length > 0) {
        const minData = new Date(Math.min(...datasValidas));
        const maxData = new Date(Math.max(...datasValidas));
        document.getElementById('txtDatas').textContent = `${formatarDataCurta(minData)} até ${formatarDataCurta(maxData)}`;
        
        const progresso = Math.round((concluidos / waypoints.length) * 100);
        document.getElementById('txtProgresso').textContent = `${progresso}%`;
        document.getElementById('barraProgresso').style.width = `${progresso}%`;
      }

      // 2. Processar Financeiro e Atividade Mais Cara
      let orcadoTotal = 0;
      let pagoTotal = 0;
      let maiorGasto = { nome: 'Nenhuma', valor: 0 };

      const gruposPorHorario = {};
      waypoints.forEach(w => {
        const chave = w.dataHora ? w.dataHora : `sem_data_${Math.random()}`;
        if (!gruposPorHorario[chave]) gruposPorHorario[chave] = [];
        gruposPorHorario[chave].push(w);
      });

      Object.keys(gruposPorHorario).forEach(chave => {
        const itens = gruposPorHorario[chave];
        const maiorOrcadoDoHorario = Math.max(...itens.map(w => (w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0))));
        orcadoTotal += maiorOrcadoDoHorario;

        itens.forEach(w => {
          const pago = w.valorPago || 0;
          pagoTotal += pago;
          const valorConsiderado = pago > 0 ? pago : (w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0));
          
          if (valorConsiderado > maiorGasto.valor) {
            maiorGasto.valor = valorConsiderado;
            maiorGasto.nome = w.atividade;
          }
        });
      });

      document.getElementById('kpiOrcado').textContent = `R$ ${orcadoTotal.toFixed(2)}`;
      document.getElementById('kpiPago').textContent = `R$ ${pagoTotal.toFixed(2)}`;
      if(maiorGasto.valor > 0) {
        document.getElementById('kpiMaiorGastoNome').textContent = maiorGasto.nome;
        document.getElementById('kpiMaiorGastoValor').textContent = `R$ ${maiorGasto.valor.toFixed(2)}`;
      }

      // 3. Processar Categorias (Baseado diretamente na propriedade w.categoria)
      let categorias = {
        'Alimentação': { valor: 0, cor: 'bg-orange-500' },
        'Hospedagem': { valor: 0, cor: 'bg-indigo-500' },
        'Transporte': { valor: 0, cor: 'bg-sky-500' },
        'Passeios': { valor: 0, cor: 'bg-emerald-500' },
        'Outros': { valor: 0, cor: 'bg-slate-400' }
      };

      waypoints.forEach(w => {
        const valor = w.valorPago > 0 ? w.valorPago : (w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0));
        if (valor === 0) return;

        let catNome = w.categoria && categorias[w.categoria] ? w.categoria : 'Outros';
        categorias[catNome].valor += valor;
      });

      const totalCategorizado = Object.values(categorias).reduce((acc, cat) => acc + cat.valor, 0);
      const listaCategorias = document.getElementById('listaCategorias');
      listaCategorias.innerHTML = '';
      
      Object.keys(categorias).forEach(nome => {
        const cat = categorias[nome];
        if (cat.valor > 0) {
          const pct = totalCategorizado > 0 ? Math.round((cat.valor / totalCategorizado) * 100) : 0;
          listaCategorias.innerHTML += `
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="font-bold text-slate-700">${nome}</span>
                <span class="text-slate-500">R$ ${cat.valor.toFixed(2)} (${pct}%)</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2">
                <div class="${cat.cor} h-2 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }
      });

      if (listaCategorias.innerHTML.trim() === '') {
        listaCategorias.innerHTML = '<p class="text-xs text-slate-400">Nenhum valor financeiro registrado.</p>';
      }

      // 4. Processar Diárias por Cidade
      const diasPorCidade = {};
      waypoints.forEach(w => {
        const cidade = w.cidade ? w.cidade.trim() : 'Não informada';
        if (w.dataHora) {
          const dataApenas = w.dataHora.split('T')[0];
          if (!diasPorCidade[cidade]) diasPorCidade[cidade] = new Set();
          diasPorCidade[cidade].add(dataApenas);
        }
      });

      const listaCidades = document.getElementById('listaCidades');
      listaCidades.innerHTML = '';
      Object.keys(diasPorCidade).forEach(cidade => {
        const qtdDias = diasPorCidade[cidade].size;
        listaCidades.innerHTML += `
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col justify-center items-center text-center">
            <span class="text-lg font-bold text-rose-600">${qtdDias}</span>
            <span class="text-[10px] font-bold text-slate-500 uppercase">${qtdDias > 1 ? 'Dias' : 'Dia'}</span>
            <span class="text-xs font-semibold text-slate-800 mt-1 line-clamp-1 w-full" title="${cidade}">${cidade}</span>
          </div>
        `;
      });

      if (listaCidades.innerHTML.trim() === '') {
        listaCidades.innerHTML = '<p class="text-xs text-slate-400 col-span-2">Nenhuma cidade/data com atividades registradas.</p>';
      }
    }

    function formatarDataCurta(data) {
      const dia = String(data.getDate()).padStart(2, '0');
      const mes = String(data.getMonth() + 1).padStart(2, '0');
      return `${dia}/${mes}`;
    }
  </script>
</body>
</html>
