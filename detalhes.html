<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo - Dashboard & KPIs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <script>
    // MANTENHA A MESMA URL DO SEU GOOGLE APPS SCRIPT AQUI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSR3uf1opKMwGW5Ywh147tSlU5-q6YDv1WUTCoQCqTitR8Q9u7i9WD61Dp7RkEuWU/exec";
  </script>

  <header class="sticky top-0 z-40 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <button onclick="window.close()" class="text-slate-500 hover:text-indigo-600 bg-slate-100 p-2 rounded-xl transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <h1 class="font-bold text-lg text-slate-900">Métricas da Viagem</h1>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Cabeçalho da Viagem -->
    <div class="text-center space-y-1">
      <h2 id="nomeViagem" class="text-2xl font-black text-slate-800 tracking-tight">Carregando...</h2>
      <p id="periodoViagem" class="text-sm font-medium text-slate-500"></p>
    </div>

    <!-- Visão Geral (Cards Pequenos) -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <i data-lucide="calendar-days" class="w-5 h-5 mx-auto text-indigo-500 mb-1"></i>
        <span id="kpiDias" class="block text-lg font-extrabold text-slate-700">0</span>
        <span class="text-[10px] uppercase font-bold text-slate-400">Dias</span>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <i data-lucide="map" class="w-5 h-5 mx-auto text-emerald-500 mb-1"></i>
        <span id="kpiCidades" class="block text-lg font-extrabold text-slate-700">0</span>
        <span class="text-[10px] uppercase font-bold text-slate-400">Cidades</span>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 text-center">
        <i data-lucide="list-todo" class="w-5 h-5 mx-auto text-amber-500 mb-1"></i>
        <span id="kpiAtividades" class="block text-lg font-extrabold text-slate-700">0</span>
        <span class="text-[10px] uppercase font-bold text-slate-400">Atividades</span>
      </div>
    </div>

    <!-- Termômetro Financeiro -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center gap-2">
        <div class="bg-blue-100 text-blue-600 p-1.5 rounded-lg"><i data-lucide="wallet" class="w-4 h-4"></i></div>
        <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Termômetro Financeiro</h3>
      </div>
      
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span class="text-slate-500">Total Pago</span>
          <span id="percentualPago" class="text-blue-600">0%</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div id="barraProgresso" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-2">
        <div>
          <span class="block text-[10px] font-bold text-slate-400 uppercase">Orçamento Total</span>
          <span id="dashOrcado" class="text-lg font-extrabold text-slate-700">R$ 0,00</span>
        </div>
        <div>
          <span class="block text-[10px] font-bold text-blue-500 uppercase">Total Pago</span>
          <span id="dashPago" class="text-lg font-extrabold text-blue-700">R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Gastos por Cidade -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="bg-amber-100 text-amber-600 p-1.5 rounded-lg"><i data-lucide="building-2" class="w-4 h-4"></i></div>
        <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Financeiro por Cidade</h3>
      </div>
      <div id="listaCidadesFinanceiro" class="space-y-4">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- Distribuição de Tempo (Dias por Cidade) -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="bg-purple-100 text-purple-600 p-1.5 rounded-lg"><i data-lucide="clock" class="w-4 h-4"></i></div>
        <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Dias por Cidade (Estadia)</h3>
      </div>
      <div id="listaCidadesTempo" class="space-y-3">
        <!-- Renderizado via JS -->
      </div>
    </div>

  </main>

  <!-- Modal de Carregamento -->
  <div id="modalLoading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl flex flex-col items-center space-y-3">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="font-bold text-slate-800 text-base">Analisando dados...</p>
    </div>
  </div>

  <script>
    let appData = { viagens: [], waypoints: [] };
    let viagemIdUrl = "";

    window.onload = () => {
      lucide.createIcons();
      carregarDashboard();
    };

    async function carregarDashboard() {
      const urlParams = new URLSearchParams(window.location.search);
      viagemIdUrl = urlParams.get('viagem');

      if (!viagemIdUrl) {
        document.getElementById('nomeViagem').textContent = "Viagem Inválida";
        document.getElementById('modalLoading').classList.add('hidden');
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getDados', viagemId: viagemIdUrl })
        });
        const data = await res.json();

        if (data.sucesso) {
          appData = data;
          
          if (data.viagens.length > 0) {
            document.getElementById('nomeViagem').textContent = data.viagens[0].nome;
          }

          processarMetricas();
        }
      } catch (e) {
        alert("Erro ao conectar com a planilha.");
      } finally {
        document.getElementById('modalLoading').classList.add('hidden');
      }
    }

    function processarMetricas() {
      const waypoints = appData.waypoints.filter(w => String(w.idViagem) === String(viagemIdUrl));
      
      if (waypoints.length === 0) return;

      // 1. Processamento de Datas (Período e Total de Dias)
      const datasValidas = waypoints.map(w => new Date(w.dataHora)).filter(d => !isNaN(d.getTime()));
      if (datasValidas.length > 0) {
        datasValidas.sort((a, b) => a - b);
        const dataInicio = datasValidas[0];
        const dataFim = datasValidas[datasValidas.length - 1];
        
        document.getElementById('periodoViagem').textContent = `${dataInicio.toLocaleDateString('pt-BR')} até ${dataFim.toLocaleDateString('pt-BR')}`;
        
        // Calcula a diferença em dias (+1 para incluir o primeiro dia)
        const diffTempo = Math.abs(dataFim - dataInicio);
        const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById('kpiDias').textContent = diffDias;
      }

      // 2. Agrupamentos por Cidade e Regras Financeiras
      const resumoCidades = {};
      let totalOrcadoGeral = 0;
      let totalPagoGeral = 0;

      // Usar a mesma lógica de agrupamento por horário para não duplicar o Orçado
      const gruposPorHorario = {};
      waypoints.forEach(w => {
        const chave = w.dataHora ? w.dataHora : `sem_data_${Math.random()}`;
        if (!gruposPorHorario[chave]) gruposPorHorario[chave] = [];
        gruposPorHorario[chave].push(w);
      });

      Object.keys(gruposPorHorario).forEach(chave => {
        const itens = gruposPorHorario[chave];
        const maiorOrcadoDoHorario = Math.max(...itens.map(w => (w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0))));
        
        totalOrcadoGeral += maiorOrcadoDoHorario;

        itens.forEach((w, index) => {
          const nomeCidade = w.cidade && w.cidade.trim() !== "" ? w.cidade : "Não Especificada";
          const pagoItem = w.valorPago || 0;
          
          totalPagoGeral += pagoItem;

          if (!resumoCidades[nomeCidade]) {
            resumoCidades[nomeCidade] = { orcado: 0, pago: 0, atividades: 0, datas: new Set() };
          }
          
          // Adiciona o orçado apenas uma vez por grupo de horário (atribui ao primeiro item do grupo para a cidade)
          if (index === 0) {
            resumoCidades[nomeCidade].orcado += maiorOrcadoDoHorario;
          }
          
          resumoCidades[nomeCidade].pago += pagoItem;
          resumoCidades[nomeCidade].atividades += 1;
          
          if (w.dataHora) {
            // Guarda apenas a string "YYYY-MM-DD" para contar dias únicos na cidade
            const dataPura = w.dataHora.split('T')[0];
            resumoCidades[nomeCidade].datas.add(dataPura);
          }
        });
      });

      // Atualiza KPIs do Topo
      document.getElementById('kpiCidades').textContent = Object.keys(resumoCidades).length;
      document.getElementById('kpiAtividades').textContent = waypoints.length;

      // Atualiza Termômetro Financeiro
      document.getElementById('dashOrcado').textContent = `R$ ${totalOrcadoGeral.toFixed(2)}`;
      document.getElementById('dashPago').textContent = `R$ ${totalPagoGeral.toFixed(2)}`;
      
      let percentual = totalOrcadoGeral > 0 ? (totalPagoGeral / totalOrcadoGeral) * 100 : 0;
      let barraProgresso = document.getElementById('barraProgresso');
      
      document.getElementById('percentualPago').textContent = `${percentual.toFixed(1)}%`;
      barraProgresso.style.width = `${Math.min(percentual, 100)}%`; // Limita visual a 100%
      
      if (percentual > 100) {
        barraProgresso.classList.remove('bg-blue-600');
        barraProgresso.classList.add('bg-rose-500'); // Fica vermelho se exceder
        document.getElementById('percentualPago').classList.replace('text-blue-600', 'text-rose-600');
      }

      // Renderiza Listas por Cidade
      const containerCidadesFin = document.getElementById('listaCidadesFinanceiro');
      const containerCidadesTempo = document.getElementById('listaCidadesTempo');
      
      Object.keys(resumoCidades).forEach(cidade => {
        const dados = resumoCidades[cidade];
        
        // HTML Financeiro
        let corPago = dados.pago > dados.orcado ? "text-rose-600" : "text-blue-600";
        containerCidadesFin.innerHTML += `
          <div class="flex justify-between items-center border-b border-slate-50 pb-3 last:border-0 last:pb-0">
            <div>
              <p class="font-bold text-sm text-slate-800">${cidade}</p>
              <p class="text-[10px] text-slate-400 font-semibold uppercase">${dados.atividades} atividades</p>
            </div>
            <div class="text-right">
              <p class="text-xs font-semibold text-slate-500">Orç: R$ ${dados.orcado.toFixed(2)}</p>
              <p class="text-sm font-extrabold ${corPago}">Pago: R$ ${dados.pago.toFixed(2)}</p>
            </div>
          </div>
        `;

        // HTML Distribuição de Tempo
        const diasNaCidade = Math.max(dados.datas.size, 1); // Pelo menos 1 dia
        containerCidadesTempo.innerHTML += `
          <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
            <span class="font-bold text-sm text-slate-700">${cidade}</span>
            <div class="flex items-center gap-1.5 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200">
              <span class="font-black text-indigo-600">${diasNaCidade}</span>
              <span class="text-[10px] font-bold text-slate-500 uppercase">Dias</span>
            </div>
          </div>
        `;
      });
      
      lucide.createIcons();
    }
  </script>
</body>
</html>
